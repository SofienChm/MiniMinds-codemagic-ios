workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic admin
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        - default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Install Capacitor CLI and Angular CLI
        script: |
          npm install -g @angular/cli @capacitor/cli
      - name: Build Angular app
        script: |
          ng build --configuration=mobile
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files com.miniminds.app \
            --type IOS_APP_STORE \
            --create \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY"
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles
      - name: Find provisioning profiles and verify aps-environment
        script: |
          echo "=== All .mobileprovision files on build machine ==="
          find /Users/builder -name "*.mobileprovision" 2>/dev/null
          echo "=== Checking each profile for aps-environment ==="
          find /Users/builder -name "*.mobileprovision" 2>/dev/null | while read f; do
            echo "--- $f ---"
            security cms -D -i "$f" 2>/dev/null | grep -A2 "aps-environment" && echo "✅ FOUND" || echo "❌ MISSING"
          done
      - name: Clean Xcode build
        script: |
          xcodebuild clean \
            -workspace ios/App/App.xcworkspace \
            -scheme App
      - name: Build and export signed IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
      - name: Verify aps-environment in built IPA
        script: |
          IPA=$(find build/ios/ipa -name "*.ipa" 2>/dev/null | head -1)
          echo "=== IPA: $IPA ==="
          mkdir -p /tmp/ipa_check
          unzip -q "$IPA" -d /tmp/ipa_check
          APP=$(find /tmp/ipa_check/Payload -name "*.app" -maxdepth 1 | head -1)
          echo "=== Embedded profile entitlements ==="
          security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null | grep -A2 "aps-environment" && echo "✅ aps-environment in profile" || echo "❌ aps-environment MISSING from profile"
          echo "=== Binary code signature entitlements ==="
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -A2 "aps-environment" && echo "✅ aps-environment in binary" || echo "❌ aps-environment MISSING from binary"
          rm -rf /tmp/ipa_check
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
